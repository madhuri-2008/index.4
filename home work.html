<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>

</head>
<body>

    <h1>Course Registration</h1>

    <form action="Thank you.html">

        <fieldset>

            <legend>personal details</legend>

            <table>
        
                 <tr>
                     <td><label>first name </label> </td>
                    <td><input type="text" name="fn" placeholder="ex:madhuri" size="16" required> </td>
                </tr>

                 <tr>
                    <td><label>surname</label> </td>
                    <td><input type="text" name="sn" placeholder="ex:anupoji" size="16" required> </td>
                </tr>

                <tr>
                   <td><label>mobile number</label> </td>
                   <td><input type="tel" name="mn" placeholder="ex:123-456-789" size="16" required> <br></td>
                </tr>

                <tr>
                   <td><label>email</label> </td>
                   <td><input type="email" name="email" placeholder="ex:madhuri@gmail.com" required><br> </td>
                </tr>

                <tr>
                   <td><label>password</label> </td>
                   <td><input type="pw" name="pw" required> </td><br>
                </tr>

                <tr>
                   <td><label>confirm password</label> </td>
                   <td><input type="pw" name="pw" placeholder="ex:" required> </td><br>
                </tr>

                <tr>
                   <td><label>dob</label> </td>
                   <td><input type="date" name="ps" required> </td><br>
                </tr>

                <tr>
                   <td><label>gender</label> </td>
                   <td><input type="radio" name="gender">male
                       <input type="radio" name="gender">female
                       <input type="radio" name="gender" required> others </td><br>
                </tr>

                <tr>
                   <td><label>select country</label></td>
                   <td><select>
                       <option>India</option>
                       <option>USA</option>
                       </select></td>
                </tr><br>

                <tr>
                   <td> <label>upload picture</label></td>
                   <td><input type="file" name="choose photo"></td>
                </tr><br>

            </table>

            <label>Skills</label>
            <input type="checkbox"> python
            <input type="checkbox"> java
            <input type="checkbox"> javascript <br>


        <input type="Reset"> <br>
        <input type="submit">


        </fieldset>

    </form>
    </body>
    </html>
